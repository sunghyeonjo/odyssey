<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>OneThing — 프로토타입</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    /*
      OneThing 프로토타입 — 1일 1포스팅 프라이빗 로깅 앱
      단일 파일(HTML/Tailwind/JS). 목업 데이터 + localStorage.

      구조(스크립트 하단 참고):
        유틸 → DB(목업) → 상태 → 셀렉터 → 컴포넌트(순수함수) → 액션 → 렌더/이벤트 → 초기화

      ※ 블라인드(락) 시스템은 추후 스펙. 코드에 자리만 남겨둠(LOCK_ENABLED).
    */
    :root {
      --accent: #7c6bff;        /* 라벤더 포인트 */
      --accent-soft: #efebff;
      --ink: #1a1a1e;
      --sub: #8a8a90;
      --faint: #c4c4cc;
      --line: #eeeef1;
      --bg: #fafafa;
      --surface: #ffffff;
    }
    * { -webkit-tap-highlight-color: transparent; }
    body {
      background: #ececef;
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", sans-serif;
      color: var(--ink);
    }

    /* 폰 프레임 (브라우저 미리보기용) */
    .phone {
      position: relative; width: 100%; max-width: 400px; height: 844px; max-height: 96vh;
      background: var(--bg); border-radius: 44px; overflow: hidden;
      border: 8px solid #1c1c1f; box-shadow: 0 30px 60px rgba(0,0,0,0.25);
      display: flex; flex-direction: column;
    }
    .stage { flex: 1; position: relative; overflow: hidden; }

    /* 스크롤 영역 */
    #screen { position: absolute; inset: 0; overflow-y: auto; padding: 56px 20px 96px; }
    #screen::-webkit-scrollbar, .noscroll::-webkit-scrollbar { display: none; }
    .fade-in { animation: fadeIn .22s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .card { background: var(--surface); border-radius: 24px; box-shadow: 0 4px 24px rgba(0,0,0,.04); border: 1px solid rgba(0,0,0,.02); }
    .press { transition: transform .12s ease; } .press:active { transform: scale(.96); }
    .btn-accent { background: var(--accent); color: #fff; }
    .btn-dark { background: var(--ink); color: #fff; }

    /* 달력 */
    .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
    .cell { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            border-radius: 14px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background .15s, color .15s; position: relative; }
    .cell.empty { visibility: hidden; }
    .cell.future { color: var(--faint); pointer-events: none; }
    .cell.past   { color: var(--ink); }
    .cell.rec    { background: var(--accent-soft); }
    .cell.today  { box-shadow: inset 0 0 0 2px var(--accent); }
    .cell.sel    { background: var(--accent) !important; color: #fff !important; }
    .dot { width: 5px; height: 5px; border-radius: 999px; background: var(--accent); margin-top: 3px; }
    .cell.sel .dot { background: #fff; }

    /* 바텀시트 */
    .sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 60;
             background: #fff; border-radius: 28px 28px 0 0; box-shadow: 0 -12px 30px rgba(0,0,0,.12);
             transform: translateY(100%); transition: transform .32s cubic-bezier(.16,1,.3,1);
             display: flex; flex-direction: column; max-height: 82%; }
    .sheet.open { transform: none; }
    .scrim { position: absolute; inset: 0; z-index: 55; background: rgba(0,0,0,.28);
             opacity: 0; pointer-events: none; transition: opacity .3s; }
    .scrim.open { opacity: 1; pointer-events: auto; }

    /* 업로드(작성) 전체 모달 */
    .modal { position: absolute; inset: 0; z-index: 70; background: #fff; display: flex; flex-direction: column;
             transform: translateY(100%); transition: transform .36s cubic-bezier(.16,1,.3,1); }
    .modal.open { transform: none; }

    /* 하단 탭 */
    .tabbar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 50; height: 84px;
              background: rgba(255,255,255,.92); backdrop-filter: blur(10px); border-top: 1px solid var(--line);
              display: flex; justify-content: space-around; align-items: flex-start; padding-top: 12px; }
    .tab { display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--faint); font-size: 11px; cursor: pointer; width: 72px; }
    .tab i { font-size: 20px; }
    .tab.on { color: var(--accent); }

    /* 사진 그리드 */
    .pgrid { display: grid; gap: 3px; border-radius: 16px; overflow: hidden; }
    .pgrid.n1 { grid-template-columns: 1fr; }
    .pgrid.n2 { grid-template-columns: 1fr 1fr; }
    .pgrid.n3 { grid-template-columns: 1fr 1fr 1fr; }
    .pgrid img { width: 100%; height: 100%; object-fit: cover; aspect-ratio: 1; display: block; background: #f0f0f2; }

    /* 토스트 */
    .toast { position: absolute; left: 50%; bottom: 104px; transform: translateX(-50%) translateY(20px); z-index: 80;
             background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 999px; font-size: 13px; font-weight: 600;
             opacity: 0; pointer-events: none; transition: all .3s; white-space: nowrap; box-shadow: 0 8px 24px rgba(0,0,0,.2); }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .chip { font-size: 11px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--sub); background: #fff; }

    /* 네잎클로버 성장 요소 */
    .clover-pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700;
                   color: var(--accent); background: var(--accent-soft); padding: 4px 10px; border-radius: 999px; }
    .clover-emoji { display: inline-block; animation: bob 2.6s ease-in-out infinite; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    .garden { background: linear-gradient(180deg, #f3f0ff 0%, #fbfaff 100%); }
    .sparkle { animation: sparkle 1.8s ease-in-out infinite; }
    @keyframes sparkle { 0%, 100% { opacity: .55; transform: scale(.94); } 50% { opacity: 1; transform: scale(1.08); } }

    /*
      코지 정원 필드 (Finch 류 레퍼런스) — 정원 탭에만 적용.
      ※ 실제 제품 퀄은 커스텀 일러스트가 필요. 여기선 CSS 씬 + 마스코트 + 이모지 펫으로 근사.
    */
    .field { position: relative; height: 258px; border-radius: 24px; overflow: hidden;
             background: linear-gradient(180deg, #8ed19a 0%, #a6dbad 44%, #c1e7c4 100%); }
    .canopy { position: absolute; top: 0; left: 0; right: 0; height: 46%;
              background: linear-gradient(180deg, #4e9d63, #6cbb79); }
    .bush { position: absolute; background: #5aa869; border-radius: 50%; }
    .pet { position: absolute; transform: translate(-50%, -50%); font-size: 26px;
           filter: drop-shadow(0 2px 2px rgba(0,0,0,.18)); animation: bob 3s ease-in-out infinite; }

    /* 마스코트 — 후드 쓴 동글 캐릭터(플레이스홀더). 최종본은 일러스트 교체 대상 */
    .mascot { position: relative; width: 62px; height: 68px; animation: bob 3.4s ease-in-out infinite; filter: drop-shadow(0 3px 3px rgba(0,0,0,.18)); }
    .m-hood { position: absolute; inset: 0 0 6px 0; background: var(--accent); border-radius: 50% 50% 46% 46%; box-shadow: inset 0 -6px 0 rgba(0,0,0,.10); }
    .m-face { position: absolute; left: 9px; right: 9px; top: 15px; bottom: 12px; background: #fdf1df; border-radius: 50%; }
    .m-eye { position: absolute; top: 15px; width: 5px; height: 7px; background: #3a2c2c; border-radius: 3px; }
    .m-eye.l { left: 12px; } .m-eye.r { right: 12px; }
    .m-cheek { position: absolute; top: 23px; width: 7px; height: 5px; background: #ffb3ba; border-radius: 50%; }
    .m-cheek.l { left: 8px; } .m-cheek.r { right: 8px; }
  </style>
</head>
<body>
  <div class="phone">
    <div class="stage">
      <div id="screen"></div>
      <div id="tabbar" class="tabbar"></div>

      <div id="scrim" class="scrim" data-action="closeSheet"></div>
      <div id="sheet" class="sheet"><div id="sheet-body" class="noscroll" style="overflow-y:auto; padding:20px;"></div></div>

      <div id="composer" class="modal"><div id="composer-body" style="flex:1; display:flex; flex-direction:column;"></div></div>

      <div id="toast" class="toast"></div>
    </div>
  </div>

  <script>
  "use strict";

  /* ============================================================
     1. 유틸 — 날짜 · 이미지 축소
     ============================================================ */
  const pad = (n) => String(n).padStart(2, "0");
  const keyOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parseKey = (k) => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
  const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return keyOf(d); };
  const WEEK = ["일", "월", "화", "수", "목", "금", "토"];
  const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  /** 업로드 이미지를 localStorage 에 담을 수 있게 축소(최대 900px, jpeg) */
  function shrink(file, max = 900) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, max / Math.max(img.width, img.height));
          const c = document.createElement("canvas");
          c.width = Math.round(img.width * scale);
          c.height = Math.round(img.height * scale);
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          resolve(c.toDataURL("image/jpeg", 0.72));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  /* ============================================================
     2. DB — 목업 + localStorage
     ============================================================ */
  const STORE_KEY = "onething.v1";
  const photo = (seed) => `https://picsum.photos/seed/${seed}/600/600`;

  function seed() {
    const today = keyOf(new Date());
    // 내 기록: 오늘 직전 4일은 채워두고 오늘은 비움 → "오늘 남기면 스트릭 +1" 데모
    const entries = {};
    const myPast = [
      { text: "아침 러닝 5km. 날이 좋았다.", photos: [photo("run1")] },
      { text: "밀린 책 두 챕터 읽음 📚", photos: [photo("book1"), photo("book2")] },
      { text: "저녁에 파스타 직접 만들어 먹기 성공", photos: [photo("pasta")] },
      { text: "프로젝트 리팩터링 마무리!", photos: [photo("code1")] },
      { text: "가벼운 산책, 하늘이 예뻤다", photos: [photo("sky1")] },
    ];
    myPast.forEach((e, i) => { entries[addDays(today, -(i + 1))] = { ...e, createdAt: Date.now() }; });

    const friends = {
      chulsoo: { name: "철수", emoji: "🧑‍💻" },
      younghee: { name: "영희", emoji: "🎨" },
      minsu:   { name: "민수", emoji: "🎧" },
      jisoo:   { name: "지수", emoji: "🌱" },
      taeho:   { name: "태호", emoji: "🏃" },
    };
    const rooms = [
      { id: "dev",  name: "개발자 스터디", icon: "fa-solid fa-code",   color: "#7c6bff", memberIds: ["chulsoo", "minsu", "taeho"] },
      { id: "book", name: "북클럽 한 달",  icon: "fa-solid fa-book",   color: "#f59e0b", memberIds: ["younghee", "jisoo", "chulsoo"] },
    ];
    // 친구 기록(오늘) — 일부만 작성 → 피드 상태 다양성
    const friendEntries = {
      chulsoo:  { [today]: { text: "오늘 배포 성공 🚀", photos: [photo("deploy")] } },
      minsu:    { [today]: { text: "새 앨범 무한반복 중", photos: [photo("music"), photo("vinyl")] } },
      younghee: { [today]: { text: "수채화 연습 3장째", photos: [photo("paint")] } },
      // jisoo, taeho 는 오늘 미작성 상태로 둠
    };
    return { me: { name: "성현", emoji: "🙂" }, today, entries, rooms, friends, friendEntries };
  }

  const db = load();
  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (_) {}
    const fresh = seed();
    persist(fresh);
    return fresh;
  }
  function persist(data = db) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); } catch (_) {}
  }

  /* ============================================================
     3. 상태 — 화면 전환/오버레이
     ============================================================ */
  const state = {
    screen: "calendar",          // calendar | rooms | feed | profile
    month: (() => { const d = parseKey(db.today); return { year: d.getFullYear(), month: d.getMonth() }; })(),
    activeRoomId: null,
    sheetDate: null,             // 열린 바텀시트의 dateKey
    composerOpen: false,
    draft: { text: "", photos: [] },
  };

  /* ============================================================
     4. 셀렉터 — 파생 데이터
     ============================================================ */
  // 락은 추후 스펙. 지금은 항상 열림. 켜려면 LOCK_ENABLED=true 로 두고 isUnlocked 만 쓰면 됨.
  const LOCK_ENABLED = false;
  const hasEntry = (k) => !!db.entries[k];
  const isUnlocked = (k) => !LOCK_ENABLED || hasEntry(k);

  const totalEntries = () => Object.keys(db.entries).length;

  /**
   * 네잎클로버 성장 — 누적 기록 수로 단계가 오름 (동물의 숲식 키우기 재미).
   * 스트릭 대신 이 성장이 동기 부여 역할을 함.
   */
  const STAGES = [
    { min: 0,  emoji: "🪴", name: "빈 화분" },
    { min: 1,  emoji: "🌱", name: "새싹" },
    { min: 3,  emoji: "🌿", name: "떡잎" },
    { min: 6,  emoji: "☘️", name: "세잎클로버" },
    { min: 10, emoji: "☘️", name: "무성한 클로버" },
    { min: 15, emoji: "🍀", name: "네잎클로버" },
  ];
  function cloverStage(count) {
    let stage = STAGES[0];
    for (const s of STAGES) if (count >= s.min) stage = s;
    return stage;
  }
  /** 다음 단계까지의 진행률 · 남은 개수 */
  function cloverProgress(count) {
    const i = STAGES.indexOf(cloverStage(count));
    const next = STAGES[i + 1];
    if (!next) return { ratio: 1, next: null, remain: 0 };
    const cur = STAGES[i];
    return { ratio: (count - cur.min) / (next.min - cur.min), next, remain: next.min - count };
  }

  /**
   * 미니펫 수집 — 기록 N개마다 귀여운 동물이 하나씩 해금돼 정원에 모임.
   * 성장(클로버)과 별개 트랙. 시드 5개 = 3마리, 오늘 기록(6) → 강아지 해금 데모.
   */
  const PETS = [
    { emoji: "🐤", name: "병아리",   min: 1 },
    { emoji: "🐰", name: "토끼",     min: 2 },
    { emoji: "🐱", name: "고양이",   min: 4 },
    { emoji: "🐶", name: "강아지",   min: 6 },
    { emoji: "🦊", name: "여우",     min: 9 },
    { emoji: "🐻", name: "곰",       min: 12 },
    { emoji: "🐨", name: "코알라",   min: 16 },
    { emoji: "🦁", name: "사자",     min: 20 },
    { emoji: "🐮", name: "젖소",     min: 25 },
    { emoji: "🐧", name: "펭귄",     min: 30 },
    { emoji: "🦔", name: "고슴도치", min: 36 },
    { emoji: "🦉", name: "부엉이",   min: 42 },
  ];
  // 정원 필드 안 펫 위치(%). PETS 순서와 1:1
  const PET_SPOTS = [
    { x: 22, y: 72 }, { x: 72, y: 70 }, { x: 46, y: 82 }, { x: 84, y: 82 },
    { x: 12, y: 84 }, { x: 60, y: 74 }, { x: 32, y: 64 }, { x: 88, y: 64 },
    { x: 8, y: 68 },  { x: 52, y: 66 }, { x: 68, y: 86 }, { x: 38, y: 74 },
  ];
  const petUnlocked = (pet, count) => count >= pet.min;
  const unlockedPetCount = (count) => PETS.filter((p) => petUnlocked(p, count)).length;
  const nextPet = (count) => PETS.find((p) => !petUnlocked(p, count)) || null;

  /** 월간 그리드: 앞쪽 빈칸 + 날짜들 */
  function monthGrid(year, month) {
    const first = new Date(year, month, 1);
    const days = new Date(year, month + 1, 0).getDate();
    const cells = [];
    for (let i = 0; i < first.getDay(); i++) cells.push(null);
    for (let d = 1; d <= days; d++) cells.push(keyOf(new Date(year, month, d)));
    return cells;
  }

  /** 방 피드(오늘): 나 + 친구별 오늘 기록 */
  function roomFeed(roomId) {
    const room = db.rooms.find((r) => r.id === roomId);
    if (!room) return { room: null, mine: null, friends: [] };
    const mine = db.entries[db.today] || null;
    const friends = room.memberIds.map((fid) => ({
      id: fid, ...db.friends[fid], entry: (db.friendEntries[fid] || {})[db.today] || null,
    }));
    return { room, mine, friends };
  }

  /* ============================================================
     5. 컴포넌트 — 순수 함수 (state/db → HTML 문자열)
     ============================================================ */
  function PhotoGrid(photos) {
    if (!photos || !photos.length) return "";
    const n = Math.min(photos.length, 3);
    return `<div class="pgrid n${n}">${photos.slice(0, 3).map((p) => `<img src="${p}" alt="" />`).join("")}</div>`;
  }

  function EntryCard({ name, emoji, when, text, photos, accent }) {
    return `
      <div class="card overflow-hidden">
        <div class="flex items-center gap-2 px-4 pt-4 pb-3">
          <div class="w-8 h-8 rounded-full flex items-center justify-center text-base" style="background:${accent || "#f2f2f4"}">${emoji || "🙂"}</div>
          <span class="font-bold text-sm">${esc(name)}</span>
          ${when ? `<span class="text-xs ml-auto" style="color:var(--sub)">${esc(when)}</span>` : ""}
        </div>
        ${photos && photos.length ? `<div class="px-1">${PhotoGrid(photos)}</div>` : ""}
        ${text ? `<p class="text-sm px-4 py-3 leading-relaxed">${esc(text)}</p>` : ""}
      </div>`;
  }

  // 후드 쓴 마스코트(플레이스홀더)
  function Mascot() {
    return `<div class="mascot"><div class="m-hood"></div><div class="m-face">
      <div class="m-eye l"></div><div class="m-eye r"></div>
      <div class="m-cheek l"></div><div class="m-cheek r"></div></div></div>`;
  }

  // ---- 달력 화면 ----
  function CalendarScreen() {
    const { year, month } = state.month;
    const stage = cloverStage(totalEntries());
    const todayEntry = db.entries[db.today];

    const cells = monthGrid(year, month).map((k) => {
      if (!k) return `<div class="cell empty"></div>`;
      const d = parseKey(k);
      const future = k > db.today;
      const cls = ["cell", future ? "future" : "past", hasEntry(k) ? "rec" : "", k === db.today ? "today" : "", k === state.sheetDate ? "sel" : ""].join(" ");
      return `<div class="${cls}" ${future ? "" : `data-action="openSheet" data-date="${k}"`}>${d.getDate()}${hasEntry(k) ? '<span class="dot"></span>' : ""}</div>`;
    }).join("");

    // 오늘의 기록 (달력 위) — 있으면 요약 카드, 없으면 작성 유도 카드
    const todayBlock = todayEntry
      ? `<div class="card p-3 flex items-center gap-3 press mb-4" data-action="openSheet" data-date="${db.today}">
           ${todayEntry.photos && todayEntry.photos[0]
             ? `<img src="${todayEntry.photos[0]}" class="w-14 h-14 rounded-2xl object-cover" alt="" />`
             : `<div class="w-14 h-14 rounded-2xl flex items-center justify-center text-xl" style="background:var(--accent-soft)">✍️</div>`}
           <div class="min-w-0 flex-1">
             <p class="text-xs font-bold" style="color:var(--sub)">오늘의 기록</p>
             <p class="text-sm font-bold truncate">${esc(todayEntry.text) || "사진 기록"}</p>
           </div>
           <i class="fa-solid fa-chevron-right" style="color:var(--faint)"></i>
         </div>`
      : `<button class="w-full card p-3 flex items-center gap-3 press text-left mb-4" data-action="openComposer">
           <div class="w-14 h-14 rounded-2xl flex items-center justify-center text-xl" style="background:var(--accent-soft);color:var(--accent)"><i class="fa-solid fa-plus"></i></div>
           <div class="flex-1">
             <p class="text-sm font-bold">오늘의 한 가지 남기기</p>
             <p class="text-xs" style="color:var(--sub)">기록하면 클로버가 자라요</p>
           </div>
         </button>`;

    return `
      <div class="fade-in">
        <div class="flex items-start justify-between mb-4">
          <div>
            <h1 class="text-2xl font-extrabold">${MONTHS[month]} ${year}</h1>
            <button class="clover-pill press mt-1" data-action="tab" data-tab="profile">
              <span class="clover-emoji">${stage.emoji}</span> ${stage.name}
            </button>
          </div>
          <button class="chip press" data-action="advanceDay" title="데모: 하루 넘기기">🌙 다음 날</button>
        </div>

        ${todayBlock}

        <div class="card p-4">
          <div class="flex items-center justify-between mb-3 px-1">
            <button class="w-8 h-8 rounded-full press" style="color:var(--sub)" data-action="prevMonth"><i class="fa-solid fa-chevron-left"></i></button>
            <span class="text-sm font-bold">${year}.${pad(month + 1)}</span>
            <button class="w-8 h-8 rounded-full press" style="color:var(--sub)" data-action="nextMonth"><i class="fa-solid fa-chevron-right"></i></button>
          </div>
          <div class="cal mb-2">
            ${WEEK.map((w, i) => `<div class="text-xs font-bold text-center" style="color:${i === 0 ? "#f43f5e" : i === 6 ? "#3b82f6" : "var(--faint)"}">${w}</div>`).join("")}
          </div>
          <div class="cal">${cells}</div>
        </div>
      </div>`;
  }

  // ---- 방 목록 화면 ----
  function RoomsScreen() {
    return `
      <div class="fade-in">
        <h1 class="text-2xl font-extrabold mb-5">나의 공간</h1>
        <div class="space-y-3">
          ${db.rooms.map((r) => {
            const wrote = r.memberIds.filter((f) => (db.friendEntries[f] || {})[db.today]).length;
            return `
            <div class="card p-4 flex items-center justify-between press" data-action="openRoom" data-room="${r.id}">
              <div class="flex items-center gap-4 min-w-0">
                <div class="w-12 h-12 rounded-2xl flex items-center justify-center text-lg" style="background:${r.color}1a; color:${r.color}"><i class="${r.icon}"></i></div>
                <div class="min-w-0">
                  <h3 class="font-bold truncate">${esc(r.name)}</h3>
                  <p class="text-xs" style="color:var(--sub)">오늘 ${wrote}명이 기록을 남겼어요</p>
                </div>
              </div>
              <i class="fa-solid fa-chevron-right" style="color:var(--faint)"></i>
            </div>`;
          }).join("")}
        </div>
      </div>`;
  }

  // ---- 방 피드 화면 ----
  function FeedScreen() {
    const { room, mine, friends } = roomFeed(state.activeRoomId);
    if (!room) return RoomsScreen();
    const wroteFriends = friends.filter((f) => f.entry);
    const idleFriends = friends.filter((f) => !f.entry);

    return `
      <div class="fade-in">
        <div class="flex items-center justify-between mb-5 -mt-2">
          <button class="w-9 h-9 rounded-full press" style="color:var(--sub)" data-action="backToRooms"><i class="fa-solid fa-chevron-left"></i></button>
          <h1 class="text-lg font-bold">${esc(room.name)}</h1>
          <div class="w-9 h-9 flex items-center justify-center" style="color:var(--faint)"><i class="fa-regular fa-calendar"></i></div>
        </div>

        ${mine
          ? EntryCard({ name: `${db.me.name} (나)`, emoji: db.me.emoji, when: "오늘", text: mine.text, photos: mine.photos, accent: "var(--accent-soft)" })
          : `<div class="btn-dark rounded-2xl p-4 flex items-center justify-between press" data-action="openComposer">
               <div><p class="font-bold text-sm">오늘의 한 가지, 아직이에요</p><p class="text-xs opacity-70">기록을 남기고 하루를 채워보세요</p></div>
               <span class="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center"><i class="fa-solid fa-plus"></i></span>
             </div>`}

        <div class="mt-4 space-y-3">
          ${wroteFriends.map((f) => EntryCard({ name: f.name, emoji: f.emoji, when: "오늘", text: f.entry.text, photos: f.entry.photos })).join("")}
        </div>

        ${idleFriends.length ? `
          <p class="text-xs font-bold mt-5 mb-2" style="color:var(--faint)">아직 안 남긴 친구</p>
          <div class="flex flex-wrap gap-2">
            ${idleFriends.map((f) => `<span class="chip">${f.emoji} ${esc(f.name)}</span>`).join("")}
          </div>` : ""}
      </div>`;
  }

  // ---- 내 정원 화면 (코지 필드 + 마스코트 + 미니펫 수집) ----
  function ProfileScreen() {
    const count = totalEntries();
    const stage = cloverStage(count);
    const unlocked = unlockedPetCount(count);
    const np = nextPet(count);
    const prevMin = unlocked > 0 ? PETS[unlocked - 1].min : 0;
    const petRatio = np ? (count - prevMin) / (np.min - prevMin) : 1;

    // 해금된 펫을 필드에 흩뿌림
    const petsInField = PETS.slice(0, unlocked).map((p, i) => {
      const s = PET_SPOTS[i];
      return `<div class="pet" style="left:${s.x}%; top:${s.y}%; animation-delay:${(i % 5) * 0.3}s">${p.emoji}</div>`;
    }).join("");

    return `
      <div class="fade-in">
        <h1 class="text-2xl font-extrabold mb-4">내 정원</h1>

        <div class="field mb-3">
          <div class="canopy"></div>
          <div class="bush" style="width:96px;height:60px;left:-14px;top:30%"></div>
          <div class="bush" style="width:74px;height:50px;right:-10px;top:36%"></div>
          <div class="bush" style="width:58px;height:38px;left:42%;top:42%;opacity:.75"></div>
          <div style="position:absolute;left:47%;top:50%;transform:translate(-50%,-50%);z-index:2">${Mascot()}</div>
          <!-- 마스코트가 가꾸는 클로버 -->
          <div class="pet" style="left:65%;top:58%;font-size:30px">${stage.emoji}</div>
          ${petsInField}
        </div>

        <div class="flex items-center justify-between mb-2">
          <span class="clover-pill"><span class="clover-emoji">${stage.emoji}</span> ${stage.name}</span>
          <span class="text-sm font-bold">미니펫 ${unlocked}/${PETS.length}</span>
        </div>
        <div class="h-2 rounded-full overflow-hidden" style="background:#e5e0ff">
          <div class="h-full" style="width:${Math.round(petRatio * 100)}%; background:var(--accent); transition:width .4s"></div>
        </div>
        <p class="text-xs mt-2 mb-4" style="color:var(--sub)">
          ${np ? `다음 친구 「${np.name}」까지 ${np.min - count}개` : "모든 미니펫을 모았어요 🎉"}
        </p>

        <div class="grid grid-cols-4 gap-2 mb-4">
          ${PETS.map((p) => {
            const on = petUnlocked(p, count);
            return `<div class="card flex flex-col items-center justify-center py-3 ${on ? "" : "opacity-55"}">
              <div class="text-2xl mb-1">${on ? p.emoji : "🔒"}</div>
              <div class="text-[10px]" style="color:var(--sub)">${on ? p.name : `${p.min}개`}</div>
            </div>`;
          }).join("")}
        </div>

        <div class="card p-4 flex items-center gap-3 mb-4">
          <div class="w-11 h-11 rounded-full flex items-center justify-center text-xl" style="background:var(--accent-soft)">${db.me.emoji}</div>
          <div><p class="font-bold text-sm">${esc(db.me.name)}</p><p class="text-xs" style="color:var(--sub)">총 ${count}개 기록 · 방 ${db.rooms.length}개</p></div>
        </div>

        <div class="space-y-2">
          ${["방 관리 및 초대 코드", "알림 및 시간대 설정", "테마"].map((t) => `
            <div class="card p-4 flex justify-between items-center text-sm font-medium press" data-action="stub">
              <span>${t}</span><i class="fa-solid fa-chevron-right" style="color:var(--faint)"></i>
            </div>`).join("")}
          <div class="card p-4 flex justify-between items-center text-sm font-medium press" data-action="reset">
            <span style="color:#f43f5e">데이터 초기화 (데모)</span><i class="fa-solid fa-rotate-left" style="color:#f43f5e"></i>
          </div>
        </div>
      </div>`;
  }

  // ---- 날짜 바텀시트 ----
  function DaySheet(dateKey) {
    const d = parseKey(dateKey);
    const entry = db.entries[dateKey];
    const isToday = dateKey === db.today;
    let body;
    if (entry) {
      body = `
        <div class="bg-[var(--bg)] rounded-2xl p-4" style="border:1px solid var(--line)">
          ${entry.photos && entry.photos.length ? `<div class="mb-3">${PhotoGrid(entry.photos)}</div>` : ""}
          <p class="text-sm leading-relaxed">${esc(entry.text) || "사진 기록"}</p>
        </div>
        ${isToday ? `<button class="w-full mt-4 rounded-2xl py-3 font-bold press" style="background:var(--accent-soft);color:var(--accent)" data-action="editToday">수정하기</button>` : ""}`;
    } else if (isToday) {
      body = `
        <div class="text-center py-6">
          <div class="text-4xl mb-3">✍️</div>
          <p class="text-sm mb-1 font-bold">오늘은 아직 비어 있어요</p>
          <p class="text-xs mb-5" style="color:var(--sub)">지금 남기면 클로버가 자라요</p>
          <button class="btn-accent rounded-2xl px-6 py-3 font-bold press" data-action="openComposer">오늘의 한 가지 남기기</button>
        </div>`;
    } else {
      body = `<div class="text-center py-10" style="color:var(--faint)"><div class="text-3xl mb-2">🗒️</div><p class="text-sm">이 날은 기록이 없어요</p></div>`;
    }
    return `
      <div class="w-10 h-1 rounded-full mx-auto mb-5 press" style="background:var(--line)" data-action="closeSheet"></div>
      <div class="flex justify-between items-end mb-4">
        <div>
          <span class="text-xs font-bold" style="color:var(--sub)">${MONTHS[d.getMonth()]}${isToday ? " · 오늘" : ""}</span>
          <h2 class="text-2xl font-extrabold">${d.getDate()}일 (${WEEK[d.getDay()]})</h2>
        </div>
        <button class="w-8 h-8 rounded-full flex items-center justify-center" style="background:var(--bg);color:var(--sub)" data-action="closeSheet"><i class="fa-solid fa-xmark"></i></button>
      </div>
      ${body}`;
  }

  // ---- 작성(업로드) 모달 ----
  function Composer() {
    const { text, photos } = state.draft;
    const slots = [0, 1, 2].map((i) => {
      if (photos[i]) {
        return `<div class="relative"><img src="${photos[i]}" class="w-full aspect-square object-cover rounded-2xl" alt="" />
                  <button class="absolute top-1.5 right-1.5 w-6 h-6 rounded-full bg-black/60 text-white text-xs flex items-center justify-center" data-action="removePhoto" data-idx="${i}"><i class="fa-solid fa-xmark"></i></button></div>`;
      }
      if (i === photos.length) {
        return `<label class="w-full aspect-square rounded-2xl flex flex-col items-center justify-center cursor-pointer" style="background:var(--bg);border:1.5px dashed var(--faint);color:var(--sub)">
                  <i class="fa-solid fa-camera text-lg mb-1"></i><span class="text-xs">${photos.length}/3</span>
                  <input type="file" accept="image/*" multiple class="hidden" data-action="pickPhotos" />
                </label>`;
      }
      return `<div class="w-full aspect-square rounded-2xl" style="background:var(--bg)"></div>`;
    }).join("");

    return `
      <div class="px-5 pt-12 pb-4 flex items-center justify-between" style="border-bottom:1px solid var(--line)">
        <button class="text-xl p-1" style="color:var(--sub)" data-action="closeComposer"><i class="fa-solid fa-xmark"></i></button>
        <h2 class="font-bold">오늘의 한 가지</h2>
        <div class="w-6"></div>
      </div>
      <div class="flex-1 overflow-y-auto p-5">
        <div class="grid grid-cols-3 gap-2 mb-4">${slots}</div>
        <textarea data-action="draftText" placeholder="오늘 하루, 한 가지를 남겨보세요" maxlength="280"
          class="w-full rounded-2xl p-4 h-28 resize-none text-sm focus:outline-none"
          style="background:var(--bg);border:1px solid var(--line)">${esc(text)}</textarea>
        <p class="text-right text-xs mt-1" style="color:var(--faint)">${text.length}/280</p>
      </div>
      <div class="p-5" style="border-top:1px solid var(--line)">
        <button class="w-full btn-accent rounded-2xl py-4 font-bold press shadow-lg ${text.trim() || photos.length ? "" : "opacity-40 pointer-events-none"}" data-action="submitPost">
          기록 완료하기
        </button>
      </div>`;
  }

  function TabBar() {
    const tabs = [
      { id: "calendar", icon: "fa-regular fa-calendar", label: "달력" },
      { id: "rooms",    icon: "fa-regular fa-compass",  label: "방" },
      { id: "profile",  icon: "fa-solid fa-seedling",   label: "정원" },
    ];
    const active = state.screen === "feed" ? "rooms" : state.screen;
    return tabs.map((t) => `
      <div class="tab ${active === t.id ? "on" : ""}" data-action="tab" data-tab="${t.id}">
        <i class="${t.icon}"></i><span>${t.label}</span>
      </div>`).join("");
  }

  /* ============================================================
     6. 액션 — state/db 변경 후 render()
     ============================================================ */
  const actions = {
    tab: (el) => { state.screen = el.dataset.tab; state.activeRoomId = null; render(); },
    prevMonth: () => { const m = state.month; state.month = m.month === 0 ? { year: m.year - 1, month: 11 } : { year: m.year, month: m.month - 1 }; render(); },
    nextMonth: () => { const m = state.month; state.month = m.month === 11 ? { year: m.year + 1, month: 0 } : { year: m.year, month: m.month + 1 }; render(); },
    openRoom: (el) => { state.activeRoomId = el.dataset.room; state.screen = "feed"; render(); },
    backToRooms: () => { state.screen = "rooms"; state.activeRoomId = null; render(); },

    openSheet: (el) => openSheet(el.dataset.date),
    closeSheet: () => closeSheet(),

    openComposer: () => openComposer(false),
    editToday: () => openComposer(true),
    closeComposer: () => closeComposer(),
    async pickPhotos(el) {
      const files = [...el.files].slice(0, 3 - state.draft.photos.length);
      for (const f of files) state.draft.photos.push(await shrink(f));
      renderComposer();
    },
    removePhoto: (el) => { state.draft.photos.splice(Number(el.dataset.idx), 1); renderComposer(); },
    submitPost: () => submitPost(),

    advanceDay: () => { db.today = addDays(db.today, 1); state.month = (() => { const d = parseKey(db.today); return { year: d.getFullYear(), month: d.getMonth() }; })(); persist(); render(); toast(`다음 날로 이동 · ${db.today}`); },
    reset: () => { localStorage.removeItem(STORE_KEY); location.reload(); },
    stub: () => toast("프로토타입에서는 생략된 화면이에요"),
  };

  function openSheet(dateKey) {
    state.sheetDate = dateKey;
    document.getElementById("sheet-body").innerHTML = DaySheet(dateKey);
    render();
    requestAnimationFrame(() => { el("#sheet").classList.add("open"); el("#scrim").classList.add("open"); });
  }
  function closeSheet() {
    el("#sheet").classList.remove("open"); el("#scrim").classList.remove("open");
    state.sheetDate = null; render();
  }
  function openComposer(edit) {
    const existing = edit ? db.entries[db.today] : null;
    state.draft = { text: existing?.text || "", photos: [...(existing?.photos || [])] };
    state.composerOpen = true;
    closeSheet();
    renderComposer();
    requestAnimationFrame(() => el("#composer").classList.add("open"));
  }
  function closeComposer() { el("#composer").classList.remove("open"); state.composerOpen = false; }
  function renderComposer() { document.getElementById("composer-body").innerHTML = Composer(); }

  function submitPost() {
    const { text, photos } = state.draft;
    if (!text.trim() && !photos.length) return;
    const before = totalEntries();
    db.entries[db.today] = { text: text.trim(), photos, createdAt: Date.now() };
    persist();
    const after = totalEntries();
    closeComposer();
    render();
    // 축하 우선순위: 새 미니펫 해금 > 클로버 단계업 > 일반 저장
    const newPet = PETS.find((p) => p.min > before && p.min <= after);
    const grew = cloverStage(after) !== cloverStage(before);
    if (newPet) toast(`${newPet.emoji} ${newPet.name}(이)가 놀러 왔어요!`);
    else if (grew) { const s = cloverStage(after); toast(`${s.emoji} ${s.name}(으)로 자랐어요!`); }
    else toast("오늘의 기록이 저장되었어요 ✨");
  }

  /* ============================================================
     7. 렌더 & 이벤트 위임
     ============================================================ */
  const el = (sel) => document.querySelector(sel);
  const SCREENS = { calendar: CalendarScreen, rooms: RoomsScreen, feed: FeedScreen, profile: ProfileScreen };

  function render() {
    el("#screen").innerHTML = (SCREENS[state.screen] || CalendarScreen)();
    el("#tabbar").innerHTML = TabBar();
  }

  let toastTimer;
  function toast(msg) {
    const t = el("#toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
  }

  // 클릭: data-action 위임 하나로 처리
  document.addEventListener("click", (e) => {
    const target = e.target.closest("[data-action]");
    if (!target) return;
    const fn = actions[target.dataset.action];
    if (fn && target.tagName !== "LABEL" && target.tagName !== "TEXTAREA") fn(target);
  });
  // 파일 선택
  document.addEventListener("change", (e) => {
    const t = e.target.closest('[data-action="pickPhotos"]');
    if (t) actions.pickPhotos(t);
  });
  // 텍스트 입력 (재렌더 없이 draft 만 갱신 → 포커스 유지).
  // 재렌더를 안 하므로 글자수와 제출 버튼 활성 상태는 여기서 직접 갱신
  document.addEventListener("input", (e) => {
    const t = e.target.closest('[data-action="draftText"]');
    if (!t) return;
    state.draft.text = t.value;
    const counter = t.parentElement.querySelector("p");
    if (counter) counter.textContent = `${t.value.length}/280`;
    const submit = el('[data-action="submitPost"]');
    if (submit) {
      const enabled = t.value.trim() || state.draft.photos.length;
      submit.classList.toggle("opacity-40", !enabled);
      submit.classList.toggle("pointer-events-none", !enabled);
    }
  });

  /* ============================================================
     8. 초기화
     ============================================================ */
  render();
  </script>
</body>
</html>
